      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#080d09" flood-opacity=".45"/>
    </filter>
  </defs>
  <g transform="rotate(-9 130 130)" filter="url(#shadow)">
    <circle cx="130" cy="130" r="112" fill="#121914" stroke="#d0e0b8" stroke-width="5" stroke-dasharray="2 7"/>
