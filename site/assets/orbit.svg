<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
<title id="title">Foreign binaries, one execution core</title><desc id="desc">Linux ELF64, Windows PE32+ and library-free macOS Mach-O guests orbit the UNIVERSE execution core, which runs tested x86-64, RISC-V and AArch64 instruction subsets on an ARM64 Mac.</desc>
<style>
.orbit-trace{animation:scan 48s linear infinite}
.orbiter{animation:beacon 3.8s ease-in-out infinite}
.orbiter-b{animation-delay:-1.3s}
.orbiter-c{animation-delay:-2.6s}
@keyframes scan{to{stroke-dashoffset:-96}}
@keyframes beacon{0%,100%{opacity:1}50%{opacity:.42}}
@media(prefers-reduced-motion:reduce){.orbit-trace,.orbiter{animation:none}}
</style>
<defs><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#303c32"/></pattern><radialGradient id="s"><stop stop-color="#ffb27b"/><stop offset="1" stop-color="#ff713d"/></radialGradient></defs>
<rect width="640" height="640" fill="url(#g)" opacity=".4"/>
<g transform="translate(320 308)" fill="none"><circle r="190" stroke="#61705b"/><circle class="orbit-trace" r="268" stroke="#414f3e" stroke-dasharray="3 9"/><ellipse rx="282" ry="126" transform="rotate(-35)" stroke="#a7b597"/><ellipse rx="220" ry="103" transform="rotate(38)" stroke="#61705b"/><path d="M-302 0H302M0-288V288" stroke="#3c4a38" stroke-dasharray="2 8"/><circle r="92" fill="url(#s)"/><path d="M-42-44H-20V12C-20 40 20 40 20 12V-44H42V12C42 69-42 69-42 12Z" fill="#131a15"/><circle class="orbiter orbiter-a" cx="-232" cy="105" r="16" fill="#e3e8d3" stroke="#131a15" stroke-width="6"/><circle class="orbiter orbiter-b" cx="119" cy="-181" r="11" fill="#ff8758"/><circle class="orbiter orbiter-c" cx="205" cy="62" r="11" fill="#e3e8d3"/><circle class="orbiter" cx="-146" cy="-186" r="8" fill="#e3e8d3"/></g>
<g font-family="monospace" font-size="14" fill="#dce3d0"><text x="36" y="451">ELF64 / x86-64</text><text x="36" y="473" fill="#ff9c71">SSE2 · SSSE3 · SSE4.1 ×22</text><text x="390" y="98">RV64IM</text><text x="510" y="411">AArch64</text><text x="104" y="100">PE32+ / WINDOWS</text><text x="36" y="497">MACH-O64 / macOS</text><text x="241" y="442" fill="#ff9c71">UIR → EXECUTION</text><text x="245" y="602">HOST / ARM64 macOS</text></g>
<g stroke="#91a080"><path d="M62 55V71M54 63H70M555 91V103M549 97H561M541 533V547M534 540H548M98 539V551M92 545H104"/></g>
</svg>
